<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{ page.title }}</title>
</head>
<body>
    {{ content }}

    <!-- Mermaid Rendering Script -->
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
        
        document.addEventListener("DOMContentLoaded", async function () {
            // Find code blocks generated by Jekyll/Kramdown
            const mermaidBlocks = document.querySelectorAll("pre code.language-mermaid, pre.language-mermaid");
            
            mermaidBlocks.forEach((codeBlock) => {
                const parent = codeBlock.parentElement.tagName === "PRE" ? codeBlock.parentElement : codeBlock;
                const div = document.createElement("div");
                div.className = "mermaid";
                div.textContent = codeBlock.textContent;
                parent.replaceWith(div);
            });

            // Initialize and render
            mermaid.initialize({ startOnLoad: false });
            await mermaid.run();
        });
    </script>
</body>
</html>
