<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title }}</title>
    
    <!-- Restores your GitHub Pages Theme CSS -->
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
</head>
<body>
    <div class="container-lg px-3 my-5 markdown-body">
        {{ content }}
    </div>

    <!-- Mermaid Rendering Script -->
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
        
        document.addEventListener("DOMContentLoaded", async function () {
            const mermaidBlocks = document.querySelectorAll("pre code.language-mermaid, pre.language-mermaid");
            
            mermaidBlocks.forEach((codeBlock) => {
                const parent = codeBlock.parentElement.tagName === "PRE" ? codeBlock.parentElement : codeBlock;
                const div = document.createElement("div");
                div.className = "mermaid";
                div.textContent = codeBlock.textContent;
                parent.replaceWith(div);
            });

            mermaid.initialize({ startOnLoad: false });
            await mermaid.run();
        });
    </script>
</body>
</html>
