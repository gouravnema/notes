<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

  mermaid.initialize({ startOnLoad: false });

  function replaceCodeBlocksAndInit() {
    const codeBlocks = document.querySelectorAll('pre > code.language-mermaid, code.language-mermaid');
    if (!codeBlocks || codeBlocks.length === 0) return;

    codeBlocks.forEach((code) => {
      const pre = code.closest('pre');
      const text = code.textContent;
      const wrapper = document.createElement('div');
      wrapper.className = 'mermaid';
      wrapper.textContent = text;
      if (pre) pre.replaceWith(wrapper);
      else code.replaceWith(wrapper);
    });

    mermaid.init(undefined, document.querySelectorAll('.mermaid'));
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', replaceCodeBlocksAndInit);
  } else {
    replaceCodeBlocksAndInit();
  }
</script>
